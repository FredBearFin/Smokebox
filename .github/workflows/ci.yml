# Runs on every pull request (and on pushes to main): build the single file, run the unit suite, run the comment audit.
# The slow browser suites are deliberately not run here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # acorn and acorn-walk (used by the comment audit) come from package.json; tools/_deps.mjs finds them in ./node_modules
      - run: npm ci
      - name: Build dist/smokebox.html
        run: node tools/build.mjs --quiet
      # The committed page is what people download and the server serves, so it must be exactly what the sources build.
      - name: Committed dist matches the sources
        run: git diff --exit-code --stat -- dist/smokebox.html || { echo "dist/smokebox.html is out of date. Run node tools/build.mjs --quiet and commit it."; exit 1; }
      - name: Unit suite
        run: node tools/test.mjs
      - name: Comment audit
        run: node tools/comment-audit.mjs
